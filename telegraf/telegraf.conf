# Telegraf: consume los mensajes MQTT del nodo y los guarda en InfluxDB.
# Las credenciales llegan por variables de entorno (docker-compose.yml).

[agent]
  interval = "5s"
  flush_interval = "5s"
  omit_hostname = true

[[inputs.mqtt_consumer]]
  servers = ["tcp://emqx:1883"]
  topics = ["iot/raspberrypi/+"]
  username = "${MQTT_USERNAME}"
  password = "${MQTT_PASSWORD}"
  qos = 1
  client_id = "telegraf-ta3"
  # Reintenta si el usuario MQTT aún no existe en EMQX.
  startup_error_behavior = "retry"
  data_format = "json_v2"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "lectura_sensor"
    timestamp_path = "timestamp"
    timestamp_format = "2006-01-02T15:04:05Z07:00"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "valor"
      type = "float"

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "sensor"

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "device_id"

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "unidad"

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  # El bucket "iot" se crea en docker-compose.yml y lo usan los dashboards.
  bucket = "iot"
